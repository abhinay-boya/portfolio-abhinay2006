<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A self-contained canvas scroll-animation template.">
  <title>Canvas Scroll Animation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #000;
      color-scheme: dark;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 500;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      background: #151719;
    }

    .scroll-container {
      position: relative;
      z-index: 1;
      height: 500vh;
    }

    .copy-section {
      position: absolute;
      left: 0;
      display: grid;
      width: 100%;
      height: 100vh;
      place-items: center;
      padding: 2rem;
      text-align: center;
      opacity: 0;
      will-change: opacity, transform;
    }

    .copy-section--hero {
      top: 0;
      place-items: start center;
      padding-top: 12vh;
    }

    .copy-section--middle {
      top: 200vh;
      place-items: start center;
      padding-top: 12vh;
    }

    .copy-section--closing {
      top: 400vh;
      place-items: end center;
      padding-bottom: 12vh;
    }

    .copy {
      width: 100%;
      min-width: 0;
      max-width: 64rem;
      text-shadow: 0 2px 24px rgb(0 0 0 / 0.45);
    }

    h1,
    h2 {
      margin: 0;
      font-size: clamp(2.35rem, 7vw, 6.75rem);
      line-height: 0.98;
      font-weight: 500;
      letter-spacing: 0.09em;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    p {
      max-width: 44rem;
      margin: 1.35rem auto 0;
      font-size: clamp(0.95rem, 1.7vw, 1.25rem);
      line-height: 1.6;
      letter-spacing: 0.045em;
      color: rgb(255 255 255 / 0.72);
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    @media (max-width: 375px) {
      .copy-section {
        padding: 1.25rem;
      }

      h1,
      h2 {
        font-size: clamp(1.8rem, 8.5vw, 2.2rem);
        letter-spacing: 0.04em;
      }

      p {
        font-size: 0.9rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .copy-section {
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="scroll-canvas" aria-hidden="true"></canvas>

  <main class="scroll-container">
    <section class="copy-section copy-section--hero" data-copy-section>
      <div class="copy">
        <h1>This is where your site opens</h1>
        <p>Scroll to move through a full-screen canvas sequence.</p>
      </div>
    </section>

    <section class="copy-section copy-section--middle" data-copy-section>
      <div class="copy">
        <h2>Your message can appear mid-scroll</h2>
        <p>Replace this line with one clear statement.</p>
      </div>
    </section>

    <section class="copy-section copy-section--closing" data-copy-section>
      <div class="copy">
        <h2>This is where the story closes</h2>
        <p>The final frame and closing thought remain together.</p>
      </div>
    </section>
  </main>

  <script>
    /*
      SWAPPING PLACEHOLDERS FOR REAL FRAMES
      1. Keep FRAME_COUNT equal to the number of images in your sequence.
      2. Replace createPlaceholderPanels() with image loading that returns an
         array of HTMLImageElement objects in playback order.
      3. Leave drawCover(), drawSequence(), the scroll handler, and the rAF
         loop unchanged. They already cover-fit, centre, and crossfade sources.
      4. Preload every image before starting render() to avoid blank frames.
    */
    const FRAME_COUNT = 5;

    const canvas = document.getElementById('scroll-canvas');
    const context = canvas.getContext('2d', { alpha: false });
    const copySections = Array.from(document.querySelectorAll('[data-copy-section]'));
    const panelColors = ['#17191b', '#20283b', '#29322f', '#3a2d27', '#08090a'];
    let scrollPosition = window.scrollY;
    let viewportWidth = 0;
    let viewportHeight = 0;
    let pixelRatio = 1;

    function createPlaceholderPanels() {
      return panelColors.map((color, index) => {
        const panel = document.createElement('canvas');
        const panelContext = panel.getContext('2d');
        panel.width = 1600;
        panel.height = 900;

        panelContext.fillStyle = color;
        panelContext.fillRect(0, 0, panel.width, panel.height);
        panelContext.fillStyle = '#ffffff';
        panelContext.textAlign = 'center';
        panelContext.textBaseline = 'middle';
        panelContext.font = '500 108px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        panelContext.fillText(`CLIP ${index + 1}`, panel.width / 2, panel.height / 2 - 24);
        panelContext.fillStyle = 'rgba(255, 255, 255, 0.62)';
        panelContext.font = '500 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        panelContext.fillText('your footage goes here', panel.width / 2, panel.height / 2 + 72);

        return panel;
      });
    }

    const panels = createPlaceholderPanels();

    function clamp(value, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, value));
    }

    function smoothstep(value) {
      return value * value * (3 - 2 * value);
    }

    function resizeCanvas() {
      const nextWidth = window.innerWidth;
      const nextHeight = window.innerHeight;
      const nextPixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      if (
        nextWidth === viewportWidth
        && nextHeight === viewportHeight
        && nextPixelRatio === pixelRatio
      ) return;

      viewportWidth = nextWidth;
      viewportHeight = nextHeight;
      pixelRatio = nextPixelRatio;
      canvas.width = Math.round(viewportWidth * pixelRatio);
      canvas.height = Math.round(viewportHeight * pixelRatio);
    }

    function drawCover(source, opacity) {
      const scale = Math.max(canvas.width / source.width, canvas.height / source.height);
      const width = source.width * scale;
      const height = source.height * scale;
      const x = (canvas.width - width) / 2;
      const y = (canvas.height - height) / 2;

      context.globalAlpha = opacity;
      context.drawImage(source, x, y, width, height);
    }

    function drawSequence(progress) {
      const panelPosition = clamp(progress * FRAME_COUNT - 0.5, 0, FRAME_COUNT - 1);
      const currentIndex = Math.floor(panelPosition);
      const nextIndex = Math.min(currentIndex + 1, FRAME_COUNT - 1);
      const blend = smoothstep(panelPosition - currentIndex);

      context.globalAlpha = 1;
      context.fillStyle = '#000000';
      context.fillRect(0, 0, canvas.width, canvas.height);
      drawCover(panels[currentIndex], 1);

      if (nextIndex !== currentIndex) {
        drawCover(panels[nextIndex], blend);
      }

      context.globalAlpha = 1;
    }

    function updateCopySections() {
      copySections.forEach((section) => {
        const sectionTop = section.offsetTop - scrollPosition;
        const visibility = 1 - clamp(Math.abs(sectionTop) / Math.max(1, viewportHeight), 0, 1);
        const easedVisibility = smoothstep(visibility);
        const travel = clamp(sectionTop / Math.max(1, viewportHeight), -1, 1) * 28;

        section.style.opacity = easedVisibility.toFixed(3);
        section.style.transform = `translate3d(0, ${travel.toFixed(2)}px, 0)`;
      });
    }

    function render() {
      resizeCanvas();
      const maxScroll = Math.max(1, document.documentElement.scrollHeight - viewportHeight);
      const progress = clamp(scrollPosition / maxScroll, 0, 1);

      drawSequence(progress);
      updateCopySections();
      requestAnimationFrame(render);
    }

    window.addEventListener('scroll', () => {
      scrollPosition = window.scrollY;
    }, { passive: true });

    requestAnimationFrame(render);
  </script>
</body>
</html>
